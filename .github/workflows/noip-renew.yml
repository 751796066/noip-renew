name: noip-renew

on:
  schedule:
    # Every 3 days at 03:00 UTC. Free hosts become confirmable on day 23 of a
    # 30-day cycle, so any run inside that window clicks the Confirm button;
    # outside it, the job exits 0 with "nothing to confirm".
    - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noip-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --upgrade pip requests

      - name: Confirm No-IP hosts
        env:
          NOIP_USERNAME: ${{ secrets.NOIP_USERNAME }}
          NOIP_PASSWORD: ${{ secrets.NOIP_PASSWORD }}
          NOIP_COOKIES: ${{ secrets.NOIP_COOKIES }}
          NOIP_DEBUG: "2"
          ARTIFACT_DIR: artifacts
        run: python noip-renew.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noip-renew-artifacts-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
